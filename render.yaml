# Free-tier blueprint: no persistent disk, so world state in
# /var/data/kult-world.json resets on every deploy, restart, and
# wake-from-idle. See render.paid.yaml for the starter-plan config
# that mounts a 1 GB disk and survives restarts.
services:
  - type: web
    name: kult-world
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: KULT_DATA_FILE
        value: /var/data/kult-world.json
      - key: KULT_SECURE_COOKIE
        value: "true"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: ROBINHOOD_RPC_URL
        sync: false
      - key: ROBINHOOD_BROWSER_RPC_URL
        value: https://rpc.testnet.chain.robinhood.com/rpc
      - key: KULT_REGISTRY_ADDRESS
        sync: false
      - key: KULT_SEASON_COMMIT_TX
        sync: false
      - key: KULT_SEASON_PHASE
        value: WORLD_OPEN
      - key: KULT_ADMIN_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: KULT_MIN_CONFIRMATIONS
        value: "1"
